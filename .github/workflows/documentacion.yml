name: Documentación

# Valida que la documentación del repositorio siga de acuerdo con el código.
# Corre en cada pull request y en cada empuje a main. Si falla, el cambio y su
# documentación no están en el mismo pull request, que es lo que este control
# existe para impedir.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar la documentación
        run: node scripts/validar-documentacion.mjs

      - name: Guardar el informe
        if: always()
        run: node scripts/validar-documentacion.mjs --json > informe-documentacion.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-documentacion
          path: informe-documentacion.json
